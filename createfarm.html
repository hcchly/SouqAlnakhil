<!-- HEADER -->

<div class="header">

<div class="logo">

</div>

<div class="nav">

<!-- FORM -->

<div class="container">

<h2>Create Your Farm Profile</h2>

<p class="subtitle">
Share your farm details so customers can discover your products.
</p>


<form>


<label>Farm Name</label>
<input type="text" placeholder="Enter farm name">



<label>Region</label>

<select>

<option>Select Region</option>
<option>Najd</option>
<option>Qassim</option>
<option>Al-Ahsa</option>

</select>



<label>Date Types</label>

<div class="date-types">

<label class="date-option">
<input type="checkbox" name="dateType" value="Ajwa">
<span>Ajwa</span>
</label>

<label class="date-option">
<input type="checkbox" name="dateType" value="Sukkari">
<span>Sukkari</span>
</label>

<label class="date-option">
<input type="checkbox" name="dateType" value="Khalas">
<span>Khalas</span>
</label>

</div>



<label>Farm Description</label>

<textarea placeholder="Describe your farm and products"></textarea>



<button>Create Farm Profile</button>

</form>

</div>

<div class="footer">

</div>
